name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go build -race ./...
      # The GnoVM worker is a module of its own (gnovm/go.mod), and gnosh
      # built with -tags nognovm must build without it; the go list gate
      # is TestFSLBinaryDoesNotLinkGnoVM, run with the tests below.
      - run: go mod tidy && git diff --exit-code
        working-directory: gnovm
      - run: go build ./...
        working-directory: gnovm
      - run: go build -tags nognovm -o /dev/null .
      # Under -race the GnoVM package takes about 20 minutes, past go test's
      # default 10.
      - run: go test -race -failfast -timeout 60m ./...
